<!DOCTYPE html>
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


<title>PA#3</title>
<style>
    body {
        background-color: #EEEEEE;
    }
</style>

<script src="./Utils/trackball-rotator.js"></script>
<script src="./Utils/m4.js"></script>
<script src="./shader.gpu"></script>
<script src="./Model.js"></script>
<script src="./StereoCamera.js"></script>
<script src="./Texture.js"></script>
<script src="./main.js"></script>

<script>
    window.onload = init;
</script>
</head>
<body>

<h2>A Cube with "Trackball" Mouse Rotation</h2>

<p id="message">Drag your mouse on the cube to rotate it.<br>
(On a touch screen, you can use your finger.)</p>


<div style="margin: 15px 0; border: 1px solid #ccc; padding: 10px; max-width: 600px;">
   <h3>Параметри 3D відображення</h3>
   <div>
      <label for="eyeSeparation">Відстань між очима: </label>
      <input type="range" id="eyeSeparation" min="0.1" max="5.0" step="0.1" value="0.7">
      <span id="eyeSeparationValue">0.7</span>
   </div>
   <div>
      <label for="fov">Поле зору (FOV): </label>
      <input type="range" id="fov" min="20" max="60" step="0.5" value="45">
      <span id="fovValue">45</span>
   </div>
   <div>
      <label for="nearClip">Ближня площина відсікання: </label>
      <input type="range" id="nearClip" min="1.0" max="15.0" step="0.5" value="8.0">
      <span id="nearClipValue">8.0</span>
   </div>
   <div>
      <label for="convergence">Відстань конвергенції: </label>
      <input type="range" id="convergence" min="8.5" max="30.0" step="0.5" value="20.0">
      <span id="convergenceValue">20.0</span>
   </div>
</div>

<div id="canvas-holder">
   <canvas width="600" height="600" id="webglcanvas" style="background-color:red"></canvas>
</div>


</body></html>
